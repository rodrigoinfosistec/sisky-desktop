<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sisky — Configuração</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f4f4f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #111;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #444;
        }

        .input-group {
            display: flex;
            align-items: center;
            border: 1.5px solid #e4e4e7;
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .input-group:focus-within {
            border-color: #111;
        }

        .input-group.error {
            border-color: #ef4444;
        }

        .input-group input {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 16px;
            font-size: 14px;
            background: transparent;
        }

        .input-group .suffix {
            padding: 12px 16px 12px 0;
            font-size: 14px;
            color: #888;
            white-space: nowrap;
        }

        .error-msg {
            color: #ef4444;
            font-size: 12px;
            margin-top: 6px;
            min-height: 18px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #111;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
            transition: background 0.2s;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">Sisky</div>
        <p class="subtitle">Configure seu acesso para começar</p>

        <label for="subdomain">Subdomínio da sua empresa</label>
        <div class="input-group" id="inputGroup">
            <input type="text" id="subdomain" placeholder="suaempresa" autocomplete="off" autocorrect="off"
                autocapitalize="off" spellcheck="false" />
            <span class="suffix">.sisky.com.br</span>
        </div>
        <p class="error-msg" id="errorMsg"></p>

        <button id="btn" onclick="handleSubmit()">Entrar</button>
    </div>

    <script>
        const input = document.getElementById('subdomain');
        const btn = document.getElementById('btn');
        const errorMsg = document.getElementById('errorMsg');
        const inputGroup = document.getElementById('inputGroup');

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSubmit();
        });

        input.addEventListener('input', () => {
            errorMsg.textContent = '';
            inputGroup.classList.remove('error');
        });

        async function handleSubmit() {
            const subdomain = input.value.trim().toLowerCase();

            // Validação de formato
            if (!subdomain) {
                showError('Digite o subdomínio da sua empresa.');
                return;
            }

            if (!/^[a-z0-9-]+$/.test(subdomain)) {
                showError('Use apenas letras minúsculas, números e hífens.');
                return;
            }

            // Valida no servidor
            setLoading(true);

            try {
                const response = await fetch(`https://${subdomain}.sisky.com.br/api/tenant/resolve`, {
                    method: 'GET',
                    signal: AbortSignal.timeout(8000),
                });

                if (response.ok) {
                    window.sisky.setSubdomain(subdomain);
                } else if (response.status === 404) {
                    showError('Subdomínio não encontrado. Verifique e tente novamente.');
                } else {
                    showError('Erro ao conectar. Tente novamente.');
                }
            } catch (e) {
                if (e.name === 'TimeoutError') {
                    showError('Tempo de conexão esgotado. Verifique sua internet.');
                } else {
                    showError('Não foi possível conectar ao servidor.');
                }
            } finally {
                setLoading(false);
            }
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            inputGroup.classList.add('error');
        }

        function setLoading(loading) {
            btn.disabled = loading;
            btn.innerHTML = loading
                ? '<span class="spinner"></span>Verificando...'
                : 'Entrar';
        }
    </script>
</body>

</html>
